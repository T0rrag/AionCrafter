name: Phase 06 validation

on:
  push:
    branches:
      - phase/06-release
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -q
      - name: Compile
        run: python -m compileall -q aioncrafter tests
      - name: Validate synthetic catalog
        run: python -m aioncrafter validate tests/fixtures/SYNTHETIC-catalog-v1.json
      - name: Validate project bootstrap
        run: python scripts/validate_bootstrap.py
